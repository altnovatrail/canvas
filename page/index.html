<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<!-- policy -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NovaTrail — страница образцов</title>
<style>
body { font: 16px/1.4 system-ui, sans-serif; margin: 16px; max-width: 960px; }
header p { margin: 4px 0; }
label, button, select { font: inherit; }
button, select { padding: 8px 12px; margin: 8px 8px 8px 0; }
#holder { margin: 8px 0; }
novatrail-canvas { display: block; }
details pre { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 12px; }
</style>
<header>
  <h1>Страница образцов</h1>
  <p id="version"></p>
  <p>Код писавшего на это открытие страницы: <strong id="code"></strong>. Запишите его: по нему отзывают согласие.</p>
  <p>Страница работает без сети: всё, что ей нужно, — в этом файле. Образец сохраняется файлом на этом устройстве.</p>
</header>
<main>
  <p><label>Задача: <select id="task"></select></label></p>
  <div id="holder"></div>
  <p><button id="save" type="button">Сохранить образец (без разметки)</button> <span id="saved" role="status"></span></p>
</main>
<!-- notices -->
<script src="main.ts"></script>
