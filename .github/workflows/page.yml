# The samples page in the emulators, on each pull request that changes what goes into it (T78 in
# RUN.md; R54, R55 in docs/decisions.md): no tablets of the author's own, so the emulators stand in
# for them, in the software they run. Each device's job builds the page itself, so that none waits
# for another (T81); Chrome in an Android emulator downloads it and opens it from the download,
# and Safari in the iPad Simulator opens it from the runner — a page opened from a file does not
# run on an iPad (В64 in RUN.md). In each the driver goes through the page's start (T20), draws a
# stroke, marks it up through the page's form, saves the sheet's and the workbook's samples, and
# sees that the page asked for nothing and broke no rule of its policy; the saved files are then
# read as sample files and held to the protocol by spec's sample-check (T81). The strokes are the
# code's: no handwriting goes into a run. The pen, the palm and iCloud need real tablets: debt Д7
# in RUN.md.
#
# The workflow runs on every pull request, with Android alone, and with the iPad too on a push to
# main, of the same paths, and by hand (T20): main holds the cache of the toolchain stage every pull
# request reads (R57), and its run checks the iPad before a release. Its first job decides whether
# the emulators have anything to check: a skipped job counts as a success, so the one check main
# requires, the last job, stands on every pull request, and one of the documents alone waits for
# no emulator.
name: Samples page

on:
  pull_request:
  # The paths the job changes looks at, in the syntax of a filter: a path added there goes here too.
  push:
    branches: [main]
    paths:
      - "src/**"
      - "page/**"
      - "scripts/page.ts"
      - "scripts/csp.ts"
      - "tasks/**"
      - "package.json"
      - "package-lock.json"
      - ".devcontainer/Dockerfile"
      - "emulators/**"
      - ".github/workflows/page.yml"
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its older run, as in ci.yml.
concurrency:
  group: page-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # What goes into the page — the package's code, the page's own, its builder, the tasks, the
  # packages and the toolchain stage — and what checks it: the drivers and this file.
  # The same list is on.push's paths above: a path added here goes there too.
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      page: ${{ steps.diff.outputs.page }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: What the pull request changes
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT" != pull_request ]]; then
            echo "page=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE...$HEAD" -- src page scripts/page.ts scripts/csp.ts \
              tasks package.json package-lock.json .devcontainer/Dockerfile emulators \
              .github/workflows/page.yml)
          echo "$changed"
          echo "page=$([[ -n "$changed" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  # The tablet of Android 16 of the probe (T74). The page is built here, as the release builds it:
  # scripts/page.ts in the toolchain stage, from the tree, with nothing but the packages the lock
  # file pins, its version none of a release. It is downloaded from the runner's server as from a
  # release of GitHub, where the emulator reaches it on its own localhost through adb reverse
  # (emulators/android.sh). The files it saved are read and held to the protocol here too, in the
  # same stage. After them the job builds the test build for T22, with the test set of texts approved
  # for tests alone, and keeps it as an artifact of its own (T84; R58, R59): no release carries it.
  android:
    name: Android
    needs: changes
    if: needs.changes.outputs.page == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # With spec/, whose recipe sample-check holds the files to the protocol (R93 spec).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      # The toolchain stage from the cache, by the Dockerfile's sha256 (R57): the Dockerfile pins
      # everything it installs by exact version, digest, sha256 and snapshot, so the image the cache
      # holds is the one it builds. A pull request's cache is its own, and only a push to main writes
      # the one every pull request reads. Saved as soon as it is built, so that a run whose emulator
      # fails later still fills it.
      - name: Toolchain image from the cache
        id: toolchain
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/toolchain.tar
          key: toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.devcontainer/Dockerfile') }}

      - name: Toolchain image
        run: bash emulators/toolchain.sh

      - name: Toolchain image into the cache
        if: steps.toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/toolchain.tar
          key: ${{ steps.toolchain.outputs.cache-primary-key }}

      # The image is in Docker, and the emulator wants the disk.
      - name: Toolchain image's file removed
        run: rm -f build/toolchain.tar

      - name: Page and its server
        run: |
          mkdir -p build/page-android
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp \
              --volume "$PWD:/work" --workdir /work \
              toolchain bash -c "npm ci --no-audit --no-fund && node scripts/page.ts build/page 0.0.0"
          docker run --detach --name page-server --network host --user "$(id -u):$(id -g)" \
              --env HOME=/tmp --volume "$PWD:/work" --workdir /work \
              toolchain sh -c "node emulators/serve.ts build/page 8080 > build/page-android/server.txt 2>&1"

      # As the action's README asks, for the emulator to use KVM.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The emulator of the probe, by the same versions (R54).
      - name: Emulator and page
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_tablet
          emulator-build: 16740729
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          emulator-boot-timeout: 900
          disable-animations: true
          script: bash emulators/android.sh emulators/page-android.ts build/page-android

      # Read as the page's own — its purpose, writer, versions and one writer's code — and held to
      # the protocol by spec's sample-check, markup and all (T81).
      - name: Saved files
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp \
              --volume "$PWD:/work" --workdir /work \
              toolchain bash -c "node emulators/saved.ts 0.0.0 build/page-android \
                && just -f spec/justfile sample-check build/page-android/saved/*.json"

      - name: Screenshots, reports and saved files
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: page-android
          path: build/page-android
          retention-days: 7
          if-no-files-found: error

      # The test build, whose screens of the eval set and of a child's session the release keeps
      # closed, built after the release build's checks so that its failure skips none of them. Its
      # file has the release build's name, samples-page_v0.0.0.html, so the artifact's name tells
      # them apart.
      - name: Test build
        if: always()
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp \
              --volume "$PWD:/work" --workdir /work \
              toolchain node scripts/page.ts build/page-test 0.0.0 --texts page/sets/test-approved-0.json

      - name: Test build kept
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: samples-page-test
          path: build/page-test
          retention-days: 7
          if-no-files-found: warn

  # Safari in the iPad Simulator, iPadOS 26.5 on the stable image, with the image's own Xcode:
  # safaridriver loses Simulator.app after a switch by xcode-select. Not iPadOS 27: on the image
  # xcode-27 safaridriver finds no session host in the simulator (T78), and the probe alone runs
  # there, through WebDriverAgent (T80). The runners of macOS have no Docker, so the page is built
  # with the Dockerfile's Node through setup-node, from the same tree and lock file.
  #
  # Not on a pull request (В66 in RUN.md, answered by the author at T20's planning): the job takes
  # 7 to 10 minutes and as many again waiting for a runner of macOS, while its driver works two; a
  # pull request waits for Android alone, and a fault only Safari sees shows on main before a release.
  ipad:
    name: iPad 26.5
    needs: changes
    if: needs.changes.outputs.page == 'true' && github.event_name != 'pull_request'
    runs-on: macos-26
    timeout-minutes: 30
    env:
      IOS: "26.5"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Node .devcontainer/Dockerfile pins, read from it: one version for every job.
      - name: Node's version
        id: node
        run: echo "version=$(sed -n 's/^ARG NODE_VERSION=//p' .devcontainer/Dockerfile)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}

      - name: Page
        run: npm ci --no-audit --no-fund && node scripts/page.ts build/page 0.0.0

      - name: Simulator, safaridriver and page
        run: bash emulators/page-ipad.sh

      # Read as the page's own; the protocol's check, which needs buf of the toolchain stage, is
      # the next job's.
      - name: Saved files
        run: node emulators/saved.ts 0.0.0 build/page-ipad-26.5

      - name: Screenshots, reports and saved files
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: page-ipad-26.5
          path: build/page-ipad-26.5
          retention-days: 7
          if-no-files-found: error

  # The files the iPad saved, held to the protocol by spec's sample-check in the toolchain stage;
  # skipped with the iPad's job.
  ipad-check:
    name: iPad's files
    needs: ipad
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: page-ipad-26.5
          path: build/page-ipad-26.5

      # The toolchain stage from the cache, as in the job android.
      - name: Toolchain image from the cache
        id: toolchain
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/toolchain.tar
          key: toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.devcontainer/Dockerfile') }}

      - name: Toolchain image
        run: bash emulators/toolchain.sh

      - name: Toolchain image into the cache
        if: steps.toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/toolchain.tar
          key: ${{ steps.toolchain.outputs.cache-primary-key }}

      # The image is in Docker, and the emulator wants the disk.
      - name: Toolchain image's file removed
        run: rm -f build/toolchain.tar

      - name: Sample files
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp \
              --volume "$PWD:/work" --workdir /work \
              toolchain just -f spec/justfile sample-check build/page-ipad-26.5/saved/sheet.json build/page-ipad-26.5/saved/workbook.json

  # The one check main requires: every job above went right, or was skipped because the pull
  # request changes nothing they check.
  result:
    name: Samples page
    needs: [changes, android, ipad, ipad-check]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Result
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"' | tee -a "$GITHUB_STEP_SUMMARY"
          bad=$(echo "$RESULTS" | jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key] | join(", ")')
          if [[ -n "$bad" ]]; then
            echo "not right: $bad — each job's summary says whether the page or the emulator failed" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
