# The probe of a page opened from a file, in an emulator or a browser on a runner of GitHub:
# no tablets of the author's own, so the emulators stand in for them, in the software they run.
# Each job builds the probe, hands its files out from the runner as a release of GitHub does, and
# lets the browser download and open them; screenshots, trees and reports are its artifact.
# Android runs in the toolchain stage of .devcontainer/Dockerfile; the runners of macOS have no
# Docker, so their jobs take the Dockerfile's Node through setup-node. The pen, the palm and iCloud
# need real tablets.
name: Emulators

on:
  pull_request:
    paths:
      # The probe alone: it has answered its question, and a change of the drivers' shared parts in
      # emulators/ is checked by the samples page's workflow, page.yml, which takes them every
      # time. The probe runs on them by workflow_dispatch when it is wanted.
      - "probe/**"
      - ".github/workflows/emulators.yml"
      # The toolchain stage the job runs the probe in. spec's toolchain.sh, which builds or loads
      # it, page.yml checks on every move of spec/.
      - ".devcontainer/Dockerfile"
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its older run, as in ci.yml.
concurrency:
  group: emulators-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android:
    name: Android
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # With spec/, whose toolchain.sh builds or loads the toolchain stage.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      # The probe needs nothing but Node: no npm ci. The toolchain stage comes from the cache, by
      # the key, the file and the image of page.yml and .github's shared workflows, which a push to
      # main fills. This workflow runs on no push, so it saves nothing: spec's script loads
      # the file and removes it, or, handed no file, only builds — the emulator wants the disk.
      - name: Toolchain image from the cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/novatrail-toolchain.tar
          key: toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.devcontainer/Dockerfile') }}

      - name: Toolchain image
        env:
          TOOLCHAIN_IMAGE_FILE: ${{ runner.temp }}/novatrail-toolchain.tar
        run: |
          if [ ! -f "$TOOLCHAIN_IMAGE_FILE" ]; then
              unset TOOLCHAIN_IMAGE_FILE
          fi
          spec/tools/toolchain/toolchain.sh build

      # The probe's two files, and the server that hands them out on port 8080 with the headers of
      # a release asset of GitHub, in the background on the runner's network, where the emulator
      # reaches it on its own localhost through adb reverse (emulators/android.sh).
      - name: Probe and its server
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp \
              --volume "$PWD:/work" --workdir /work \
              novatrail-toolchain node probe/build.ts build/probe
          docker run --detach --name probe-server --network host --user "$(id -u):$(id -g)" \
              --env HOME=/tmp --volume "$PWD:/work" --workdir /work \
              novatrail-toolchain node emulators/serve.ts build/probe 8080

      # As the action's README asks, for the emulator to use KVM.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # A tablet of Android 16 with Google's APIs: a debuggable image, on which Chrome reads the
      # flags that keep its first run out of the way. The emulator's build is pinned; the image's
      # revision is what sdkmanager installs, and the run writes it down.
      - name: Emulator and probe
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_tablet
          emulator-build: 16740729
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          emulator-boot-timeout: 900
          disable-animations: true
          script: bash emulators/android.sh probe/android.ts build/probe-android

      - name: Server log
        if: always()
        run: docker logs probe-server > build/probe-android/server.txt 2>&1 || true

      - name: Screenshots and reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: probe-android
          path: build/probe-android
          retention-days: 7
          if-no-files-found: error

  # The iPad Simulator on both iPadOS the volunteers may have: 27, on the image GitHub still calls a
  # public preview, and 26.5 on the stable one. WebDriverAgent, built from its tag by the image's
  # Xcode or taken from the cache of that build, taps for the driver.
  ipad:
    name: iPad ${{ matrix.ios }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: xcode-27, xcode: "27.1", ios: "27" }
          - { runner: macos-26, xcode: "26.6", ios: "26.5" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Node .devcontainer/Dockerfile pins, read from it: one version for every job.
      - name: Node's version
        id: node
        run: echo "version=$(sed -n 's/^ARG NODE_VERSION=//p' .devcontainer/Dockerfile)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}

      - name: Probe and its server
        run: |
          node probe/build.ts build/probe
          mkdir -p build/probe-ipad
          nohup node emulators/serve.ts build/probe 8080 > build/probe-ipad/server.txt 2>&1 &

      - name: Xcode
        run: sudo xcode-select -s "/Applications/Xcode_${{ matrix.xcode }}.app"

      # WebDriverAgent's build for testing from the cache, keyed by the commit probe/ipad.sh
      # pins, the script's own sha256, which holds how it builds, and the build of the Xcode it
      # builds with, read from the Xcode's own version.plist as emulators/simulator.sh reads it. Not
      # by the build's own sha256: it is not reproducible byte for byte, and probe/ipad.sh builds it
      # anew when the cache's is of another commit or does not start.
      - name: WebDriverAgent's key
        id: wda-key
        env:
          SCRIPT: ${{ hashFiles('probe/ipad.sh') }}
        run: |
          commit=$(sed -n 's/^wda_commit=//p' probe/ipad.sh)
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          xcode=$(/usr/libexec/PlistBuddy -c "Print :ProductBuildVersion" "$(xcode-select -p)/../version.plist")
          echo "key=wda-$commit-xcode-$xcode-${{ runner.os }}-${{ runner.arch }}-$SCRIPT" >> "$GITHUB_OUTPUT"

      - name: WebDriverAgent from the cache
        id: wda
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/wda/Build/Products
          key: ${{ steps.wda-key.outputs.key }}

      - name: Simulator, WebDriverAgent and probe
        env:
          IOS: ${{ matrix.ios }}
        run: bash probe/ipad.sh

      # Before the files are kept: left running, the simulator and xcodebuild slowed their upload.
      - name: Simulator and servers stopped
        if: always()
        run: bash emulators/stop.sh

      # A build of this run that started, kept whatever the probe found; a pull request's entry is
      # its own, and a run by hand on main fills the one every pull request reads.
      - name: WebDriverAgent into the cache
        if: always() && hashFiles('build/wda-started') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/wda/Build/Products
          key: ${{ steps.wda-key.outputs.key }}

      - name: Screenshots, trees and reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: probe-ipad-${{ matrix.ios }}
          path: build/probe-ipad
          retention-days: 7
          if-no-files-found: error

  # Safari on macOS, the file opened from the Downloads folder as Finder opens it, through the
  # system's safaridriver.
  safari:
    name: Safari on macOS
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Node .devcontainer/Dockerfile pins, read from it: one version for every job.
      - name: Node's version
        id: node
        run: echo "version=$(sed -n 's/^ARG NODE_VERSION=//p' .devcontainer/Dockerfile)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}

      - name: Probe, its server and safaridriver
        run: |
          node probe/build.ts build/probe
          mkdir -p build/probe-safari
          nohup node emulators/serve.ts build/probe 8080 > build/probe-safari/server.txt 2>&1 &
          sudo safaridriver --enable
          nohup safaridriver --port 4444 > build/probe-safari/safaridriver.txt 2>&1 &
          for _ in $(seq 1 30); do
            curl --silent --fail http://127.0.0.1:4444/status > /dev/null && curl --silent --fail -o /dev/null http://127.0.0.1:8080/t29-probe-csp.html && break
            sleep 1
          done
          curl --silent --fail http://127.0.0.1:4444/status > /dev/null
          { echo "image ${ImageOS:-unknown} ${ImageVersion:-unknown}"; sw_vers; /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" /Applications/Safari.app/Contents/Info.plist; } > build/probe-safari/versions.txt

      - name: Probe
        run: node probe/safari.ts

      - name: Reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: probe-safari
          path: build/probe-safari
          retention-days: 7
          if-no-files-found: error
