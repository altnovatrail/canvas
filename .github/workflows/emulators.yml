# The probe of a page opened from a file, in an emulator or a browser on a runner of GitHub (T74
# and T80 in RUN.md; R54 in docs/decisions.md): no tablets of the author's own, so the emulators
# stand in for them, in the software they run. Each job builds the probe, hands its files out from
# the runner as a release of GitHub does, and lets the browser download and open them; screenshots,
# trees and reports are its artifact. Android runs in the toolchain stage of
# .devcontainer/Dockerfile; the runners of macOS have no Docker, so their jobs take the Dockerfile's
# Node through setup-node. The pen, the palm and iCloud need real tablets: debt Д7 in RUN.md.
name: Emulators

on:
  pull_request:
    paths:
      # The probe alone: it has answered its question (T29, T74, T80), and a change of the drivers'
      # shared parts in emulators/ is checked by the samples page's workflow, page.yml, which takes
      # them every time. The probe runs on them by workflow_dispatch when it is wanted (T81).
      - "probe/**"
      - ".github/workflows/emulators.yml"
      # The toolchain stage the job runs the probe in, and the script that builds or loads it.
      - ".devcontainer/Dockerfile"
      - "emulators/toolchain.sh"
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its older run, as in ci.yml.
concurrency:
  group: emulators-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android:
    name: Android
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The probe needs nothing but Node: no npm ci. The toolchain stage comes from the cache, by the
      # Dockerfile's sha256, as in page.yml, where main fills the cache (R57).
      - name: Toolchain image from the cache
        id: toolchain
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/toolchain.tar
          key: toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.devcontainer/Dockerfile') }}

      - name: Toolchain image
        run: bash emulators/toolchain.sh

      - name: Toolchain image into the cache
        if: steps.toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/toolchain.tar
          key: ${{ steps.toolchain.outputs.cache-primary-key }}

      # The image is in Docker, and the emulator wants the disk.
      - name: Toolchain image's file removed
        run: rm -f build/toolchain.tar

      # The probe's two files, and the server that hands them out on port 8080 with the headers of
      # a release asset of GitHub, in the background on the runner's network, where the emulator
      # reaches it on its own localhost through adb reverse (emulators/android.sh).
      - name: Probe and its server
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp \
              --volume "$PWD:/work" --workdir /work \
              toolchain node probe/build.ts build/probe
          docker run --detach --name probe-server --network host --user "$(id -u):$(id -g)" \
              --env HOME=/tmp --volume "$PWD:/work" --workdir /work \
              toolchain node emulators/serve.ts build/probe 8080

      # As the action's README asks, for the emulator to use KVM.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # A tablet of Android 16 with Google's APIs: a debuggable image, on which Chrome reads the
      # flags that keep its first run out of the way. The emulator's build is pinned; the image's
      # revision is what sdkmanager installs, and the run writes it down (R54).
      - name: Emulator and probe
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_tablet
          emulator-build: 16740729
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          emulator-boot-timeout: 900
          disable-animations: true
          script: bash emulators/android.sh probe/android.ts build/probe-android

      - name: Server log
        if: always()
        run: docker logs probe-server > build/probe-android/server.txt 2>&1 || true

      - name: Screenshots and reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: probe-android
          path: build/probe-android
          retention-days: 7
          if-no-files-found: error

  # The iPad Simulator on both iPadOS the volunteers may have: 27, on the image GitHub still calls a
  # public preview, and 26.5 on the stable one. WebDriverAgent, built from its tag by the image's
  # Xcode, taps for the driver (T80).
  ipad:
    name: iPad ${{ matrix.ios }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: xcode-27, xcode: "27.1", ios: "27" }
          - { runner: macos-26, xcode: "26.6", ios: "26.5" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Node .devcontainer/Dockerfile pins, read from it: one version for every job.
      - name: Node's version
        id: node
        run: echo "version=$(sed -n 's/^ARG NODE_VERSION=//p' .devcontainer/Dockerfile)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}

      - name: Probe and its server
        run: |
          node probe/build.ts build/probe
          mkdir -p build/probe-ipad
          nohup node emulators/serve.ts build/probe 8080 > build/probe-ipad/server.txt 2>&1 &

      - name: Xcode
        run: sudo xcode-select -s "/Applications/Xcode_${{ matrix.xcode }}.app"

      - name: Simulator, WebDriverAgent and probe
        env:
          IOS: ${{ matrix.ios }}
        run: bash probe/ipad.sh

      - name: Screenshots, trees and reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: probe-ipad-${{ matrix.ios }}
          path: build/probe-ipad
          retention-days: 7
          if-no-files-found: error

  # Safari on macOS, the file opened from the Downloads folder as Finder opens it, through the
  # system's safaridriver (T80).
  safari:
    name: Safari on macOS
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Node .devcontainer/Dockerfile pins, read from it: one version for every job.
      - name: Node's version
        id: node
        run: echo "version=$(sed -n 's/^ARG NODE_VERSION=//p' .devcontainer/Dockerfile)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}

      - name: Probe, its server and safaridriver
        run: |
          node probe/build.ts build/probe
          mkdir -p build/probe-safari
          nohup node emulators/serve.ts build/probe 8080 > build/probe-safari/server.txt 2>&1 &
          sudo safaridriver --enable
          nohup safaridriver --port 4444 > build/probe-safari/safaridriver.txt 2>&1 &
          for _ in $(seq 1 30); do
            curl --silent --fail http://127.0.0.1:4444/status > /dev/null && curl --silent --fail -o /dev/null http://127.0.0.1:8080/t29-probe-csp.html && break
            sleep 1
          done
          curl --silent --fail http://127.0.0.1:4444/status > /dev/null
          { sw_vers; /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" /Applications/Safari.app/Contents/Info.plist; } > build/probe-safari/versions.txt

      - name: Probe
        run: node probe/safari.ts

      - name: Reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: probe-safari
          path: build/probe-safari
          retention-days: 7
          if-no-files-found: error
