# NovaTrail's shared checks (R03 .github), pinned to a release of .github by SHA with its version
# beside it; Dependabot moves both. The repository's own jobs go beside them.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels its older run; every commit to main is checked.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: Secrets
    uses: altnovatrail/.github/.github/workflows/secrets.yml@93c848fb51a10a245968cf730b99cc709a7748bf # v0.1.31

  # A pull request's commits are what it checks; a push to main has been checked as one.
  dco:
    name: DCO
    if: github.event_name == 'pull_request'
    uses: altnovatrail/.github/.github/workflows/dco.yml@93c848fb51a10a245968cf730b99cc709a7748bf # v0.1.31

  documents:
    name: Documents
    uses: altnovatrail/.github/.github/workflows/documents.yml@93c848fb51a10a245968cf730b99cc709a7748bf # v0.1.31

  # The repository's TypeScript code, by its own ci- recipes in its toolchain stage (R19 .github).
  # Its licenses job checks the spec submodule out from v0.1.8 on, for ci-licenses to run spec's
  # recipes from it: an older release would turn that check red. There ci-licenses also checks the
  # signature of each package of @altnovatrail in the lock file, which needs the network the job
  # has (R77 spec; R44). From v0.1.12 on its coverage job
  # sends the report of ci-test to Codecov by OIDC, and a nested job has no more than this one
  # gives it: without id-token: write the run would not start at all (R43). From v0.1.29 on its
  # input engines adds the check "TypeScript / engines", the recipe ci-engines — the tests in WebKit
  # and Firefox, beside ci-test's Node and Chromium with the coverage —, so that the two run side by
  # side (R19 .github; the T116 amendment to R78). From v0.1.25 on its job toolchain alone builds the
  # image on a miss and only a push to main saves it, by the path and the name page.yml and
  # emulators.yml take too (R42 .github; the T116 amendment to R57). From v0.1.31 on lint, vuln
  # and licenses, which start no browser, run in the stage toolchain-core — Node, just, Go and
  # buf, which the Dockerfile has from spec v0.18.4 under toolchain and its browsers —, and so does
  # the job of documents.yml; the job toolchain keeps the core's image by a file and a key of its
  # own (R47 .github; the T117 amendment to R57).
  typescript:
    name: TypeScript
    permissions:
      contents: read
      id-token: write
    uses: altnovatrail/.github/.github/workflows/typescript.yml@93c848fb51a10a245968cf730b99cc709a7748bf # v0.1.31
    with:
      engines: true
