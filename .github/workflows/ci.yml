# NovaTrail's shared checks, pinned to a release of .github by SHA with its version
# beside it; Dependabot moves both. The repository's own jobs go beside them.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels its older run; every commit to main is checked.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: Secrets
    uses: altnovatrail/.github/.github/workflows/secrets.yml@baa18cde370b3515e85b180d0563cb3eaa4955f2 # v0.1.34

  # A pull request's commits are what it checks; a push to main has been checked as one.
  dco:
    name: DCO
    if: github.event_name == 'pull_request'
    uses: altnovatrail/.github/.github/workflows/dco.yml@baa18cde370b3515e85b180d0563cb3eaa4955f2 # v0.1.34

  documents:
    name: Documents
    uses: altnovatrail/.github/.github/workflows/documents.yml@baa18cde370b3515e85b180d0563cb3eaa4955f2 # v0.1.34

  # The repository's TypeScript code, by its own ci- recipes in its toolchain stage.
  # Its licenses job checks the spec submodule out, for ci-licenses to run spec's recipes from it,
  # and there ci-licenses also checks the signature of each package of @altnovatrail in the lock
  # file, which needs the network the job has. Its coverage job sends the report
  # of ci-test to Codecov by OIDC, and a nested job has no more than this one gives it: without
  # id-token: write the run would not start at all. Its input engines adds the check
  # "TypeScript / engines", the recipe ci-engines — the tests in WebKit and Firefox, beside
  # ci-test's Node and Chromium with the coverage —, so that the two run side by side. Its job
  # toolchain alone builds the image on a miss and only a push to main saves it, by the path and the
  # name page.yml and emulators.yml take too. Lint, vuln and licenses, which start no browser, run
  # in the stage toolchain-core — Node, just, Go and buf, under toolchain and its browsers —, and so
  # does the job of documents.yml; the job toolchain keeps the core's image by a file and a key of
  # its own. A release of .github older than v0.1.31 lacks one of these and turns a check red.
  typescript:
    name: TypeScript
    permissions:
      contents: read
      id-token: write
    uses: altnovatrail/.github/.github/workflows/typescript.yml@baa18cde370b3515e85b180d0563cb3eaa4955f2 # v0.1.34
    with:
      engines: true
