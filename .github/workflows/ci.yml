# NovaTrail's shared checks (R03 .github), pinned to a release of .github by SHA with its version
# beside it; Dependabot moves both. The repository's own jobs go beside them.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels its older run; every commit to main is checked.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: Secrets
    uses: altnovatrail/.github/.github/workflows/secrets.yml@4225639bcd04f43ef58f95cabf9fdfd947cbcb07 # v0.1.12

  # A pull request's commits are what it checks; a push to main has been checked as one.
  dco:
    name: DCO
    if: github.event_name == 'pull_request'
    uses: altnovatrail/.github/.github/workflows/dco.yml@4225639bcd04f43ef58f95cabf9fdfd947cbcb07 # v0.1.12

  documents:
    name: Documents
    uses: altnovatrail/.github/.github/workflows/documents.yml@4225639bcd04f43ef58f95cabf9fdfd947cbcb07 # v0.1.12

  # The repository's TypeScript code, by its own ci- recipes in its toolchain stage (R19 .github).
  # Its licenses job checks the spec submodule out from v0.1.8 on, for ci-licenses to run spec's
  # recipe from it: an older release would turn that check red. From v0.1.12 on its coverage job
  # sends the report of ci-test to Codecov by OIDC, and a nested job has no more than this one
  # gives it: without id-token: write the run would not start at all (R43).
  typescript:
    name: TypeScript
    permissions:
      contents: read
      id-token: write
    uses: altnovatrail/.github/.github/workflows/typescript.yml@4225639bcd04f43ef58f95cabf9fdfd947cbcb07 # v0.1.12
