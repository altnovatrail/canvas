# NovaTrail's shared checks (R03 .github), pinned to a release of .github by SHA with its version
# beside it; Dependabot moves both. The repository's own jobs go beside them.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels its older run; every commit to main is checked.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: Secrets
    uses: altnovatrail/.github/.github/workflows/secrets.yml@f3addb7403d084c560c61481e217b93f8e7ee1f3 # v0.1.10

  # A pull request's commits are what it checks; a push to main has been checked as one.
  dco:
    name: DCO
    if: github.event_name == 'pull_request'
    uses: altnovatrail/.github/.github/workflows/dco.yml@f3addb7403d084c560c61481e217b93f8e7ee1f3 # v0.1.10

  documents:
    name: Documents
    uses: altnovatrail/.github/.github/workflows/documents.yml@f3addb7403d084c560c61481e217b93f8e7ee1f3 # v0.1.10

  # The repository's TypeScript code, by its own ci- recipes in its toolchain stage (R19 .github).
  # Its licenses job checks the spec submodule out from v0.1.8 on, for ci-licenses to run spec's
  # recipe from it: an older release would turn that check red.
  typescript:
    name: TypeScript
    uses: altnovatrail/.github/.github/workflows/typescript.yml@f3addb7403d084c560c61481e217b93f8e7ee1f3 # v0.1.10
