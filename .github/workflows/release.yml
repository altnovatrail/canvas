# NovaTrail's shared release (R18 .github), pinned to a release of .github by SHA with its version
# beside it. RELEASE_LINE is the line the releases are numbered in; paths, what they are built from:
# all a consumer gets of the package, as architecture 3.3 .github lists it for a repository of Go
# (R08 in docs/decisions.md). A run after CI on main, and the button, publish the release and the
# same archive to npm, through trusted publishing, with no token kept anywhere; a pull request tries
# it, publishing nothing: it builds the files, signs them and checks them, the npm package's archive
# too (T66, T70, T71). The first version was published by hand from its release (T70).

name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # Every pull request, with no paths of its own: a filter would copy the list below in another
  # syntax, and a run of a change outside the list ends once the version is worked out.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # 0.2 since T77: the element reads the module format 0.3 and refuses a manifest of 0.2, which
  # every release of 0.1 took (the amendment of 2026-11-08 to R08 in docs/decisions.md).
  RELEASE_LINE: "0.2"

jobs:
  release:
    name: Release
    # A trial asks no CI to have passed, so this asks it of a run after CI: a commit whose checks
    # failed is no release to try.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: write
      id-token: write
      actions: read
    uses: altnovatrail/.github/.github/workflows/release.yml@89d3ceee0b9977b3334488a4133d084d76474e0d # v0.1.15
    with:
      # The package's code without its tests, fixtures and type checks — a pathspec's * takes any
      # depth — what builds it, what npm pack takes besides it, the toolchain stage that runs npm,
      # and this file, so that a change of the line gives a release. The synthetic samples too:
      # their generator is src/eval/, which src/*.ts takes, and its script, its build, the archive's
      # script, tutor's file of open tasks and the lock file, whose packages write each sample's
      # JSON (R50). The lock file is no part of the package's archive, and its compiler is pinned in
      # package.json.
      paths: |
        src/*.ts
        :(exclude)src/*.test.ts
        :(exclude)src/*.fixture.ts
        :(exclude)src/*.check.ts
        scripts/synthetic.ts
        scripts/archive.ts
        tsconfig.synthetic.json
        tasks/*
        package-lock.json
        package.json
        tsconfig.base.json
        tsconfig.build.json
        justfile
        README.md
        LICENSE
        NOTICE
        .devcontainer/Dockerfile
        .github/workflows/release.yml
      publish: ${{ github.event_name != 'pull_request' }}
      npm-package: "@altnovatrail/canvas"
