version: 2

updates:
  # The actions of the workflows, and the references to .github's shared workflows with them.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3

  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: weekly
    cooldown:
      default-days: 3

  # The npm packages the code is built and checked with. Two additions to architecture 3.3 of
  # .github, each for a reason of canvas's own (R12 in docs/decisions.md). The browser the tests run
  # in is no package: it comes with the toolchain stage of .devcontainer/Dockerfile, and a pull
  # request that raises playwright stays red until the image there is raised with it, by hand.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      # @vitest/browser-playwright pins vitest exactly, so the two move in one pull request.
      vitest:
        patterns: ["vitest", "@vitest/*"]
    ignore:
      # The types of Node follow the major version of the Node in .devcontainer/Dockerfile, which
      # moves by hand.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
