version: 2

updates:
  # The actions of the workflows, and the references to .github's shared workflows with them.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      # Every reference to a shared workflow of .github in one pull request, to one release:
      # Dependabot names each altnovatrail/.github/.github/workflows/<file>.yml.
      shared-workflows:
        patterns: ["altnovatrail/.github/*"]

  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: weekly
    cooldown:
      default-days: 3

  # The npm packages the code is built and checked with. The group and the ignores below are
  # canvas's own, each for the reason beside it. The browsers the tests run in — Chrome
  # Headless Shell, WebKit and Firefox — are no package: they come with the toolchain stage of
  # .devcontainer/Dockerfile, from spec's template, and a pull request that raises playwright stays
  # red until the image and the three revisions there are raised with it, by hand, with a row
  # «в реестр spec» for the template.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      # @vitest/browser-playwright and @vitest/coverage-v8 pin vitest exactly, so the three move in
      # one pull request. Vite, which vitest runs on and just demo serves with, moves with them.
      vitest:
        patterns: ["vitest", "@vitest/*", "vite"]
    ignore:
      # The types of Node follow the major version of the Node in .devcontainer/Dockerfile, which
      # moves by hand.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # The types of the module format and of the element are spec's, at the version of the tag the
      # spec/ submodule stands on: the two move together, in a move to a new tag of spec,
      # and ci-licenses checks the package's signature by spec's release-verify-npm.
      - dependency-name: "@altnovatrail/spec"
      # The code and vectors of spec's API contracts — the eval protocol's sample file among them —
      # come from the same tag, and move with the submodule the same way.
      - dependency-name: "@altnovatrail/contracts"
      # The runtime of that code is the one @altnovatrail/contracts pins exactly: the sample file's
      # module writes and reads its messages with it, so it moves with that package.
      - dependency-name: "@bufbuild/protobuf"
      # The set of icons moves only by a row of spec's COORDINATION.md, together with skill-map and
      # app, which build in the same set at the same version; just icons then writes the icons and
      # NOTICE anew.
      - dependency-name: "@iconify-json/material-symbols"
