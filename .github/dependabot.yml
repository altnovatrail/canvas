version: 2

updates:
  # The actions of the workflows, and the references to .github's shared workflows with them.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3

  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: weekly
    cooldown:
      default-days: 3

  # The npm packages the code is built and checked with. Three additions to architecture 3.3 of
  # .github, each for a reason of canvas's own (R12 and R41 in docs/decisions.md). The browser the
  # tests run in is no package: it comes with the toolchain stage of .devcontainer/Dockerfile, from
  # spec's template, and a pull request that raises playwright stays red until the image there is
  # raised with it, by hand, with a row «в реестр spec» for the template (R79 spec, R13). One that
  # raises the set of icons stays red until `just icons` writes the icons and NOTICE anew (R46).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      # @vitest/browser-playwright and @vitest/coverage-v8 pin vitest exactly, so the three move in
      # one pull request. Vite, which vitest runs on and just demo serves with, moves with them.
      vitest:
        patterns: ["vitest", "@vitest/*", "vite"]
    ignore:
      # The types of Node follow the major version of the Node in .devcontainer/Dockerfile, which
      # moves by hand.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # The types of the module format and of the element are spec's, at the version of the tag the
      # spec/ submodule stands on: the two move together, in a move to a new tag of spec (R73 spec),
      # and ci-licenses checks the package's signature by spec's release-verify-npm (R77 spec).
      - dependency-name: "@altnovatrail/spec"
      # The code and vectors of spec's API contracts — the eval protocol's sample file among them —
      # come from the same tag, and move with the submodule the same way (R92 and R94 spec).
      - dependency-name: "@altnovatrail/contracts"
