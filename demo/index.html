<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>novatrail-canvas, by hand</title>
<!-- The page to try the element on by hand, as app is to have it (RUN.md, T15): the history of
     writing kept as the element tells it and given back to a sheet opened again, the element's
     own buttons in the language the page gives it, with the tools the task allows (T41), a
     task's grid, statement and height of digits, in a light or a dark theme (T11), the groups of
     the strokes under the sheet, by a rule the page can change (T12), the crop for checking
     (T13), and the tutor's marks, given back over the crop Check sent (T14). -->
<style>
  body { margin: 0; padding: 16px; background: #f4f4f1; color: #1d1d1b;
         font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  body.dark { background: #1b1d21; color: #e7e7e3; }
  main { max-width: 1040px; margin: 0 auto; }
  novatrail-canvas { height: 600px; border: 1px solid #d4d4cf; }
  /* The dark theme: the element's custom properties, which its shadow tree inherits. */
  body.dark novatrail-canvas { border-color: #3a3d44;
    --novatrail-canvas-paper: #24272d; --novatrail-canvas-grid: #3d434d;
    --novatrail-canvas-ink: #f1f1ec; --novatrail-canvas-mark: #8fb4ff; }
  .tools { display: flex; gap: 8px; align-items: center; margin: 10px 0; flex-wrap: wrap; }
  button, select, input { font: inherit; padding: 6px 14px; border: 1px solid #d4d4cf; border-radius: 6px;
           background: #fff; color: #1d1d1b; }
  input { width: 5em; padding: 6px 8px; }
  button { cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: default; }
  button[aria-pressed="true"] { background: #1d1d1b; border-color: #1d1d1b; color: #fff; }
  #status { color: #6b6b66; }
  figure { margin: 0; }
  figcaption { color: #6b6b66; font-size: 0.9rem; }
  /* The groups of the strokes: a small sheet, its strokes as lines, each group a labelled box. */
  .groups { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; margin: 10px 0; }
  #groups { width: 250px; background: #fff; border: 1px solid #d4d4cf; }
  #groups .ink { fill: none; stroke: #1d1d1b; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  #groups .group { fill: none; stroke: #2f6fb3; stroke-width: 3; }
  /* A white edge keeps a label legible over ink and over a neighbour's box. */
  #groups .label { fill: #2f6fb3; font: bold 40px system-ui, sans-serif;
                   stroke: #fff; stroke-width: 8; paint-order: stroke; }
  /* The crop for checking: its pixels at their own size, the frames of its groups over them. */
  .crop { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; margin: 10px 0; }
  .crop figure { max-width: 100%; }
  .cropped { position: relative; display: inline-block; max-width: 100%; line-height: 0; }
  #crop { display: block; max-width: 100%; height: auto; border: 1px solid #d4d4cf; }
  #crop:not([src]) { display: none; }
  #frames { position: absolute; left: 1px; top: 1px; width: calc(100% - 2px); height: calc(100% - 2px);
            pointer-events: none; }
  #frames .frame { fill: none; stroke: #c2410c; stroke-width: 1.5; }
  #frames .label { fill: #c2410c; font: bold 12px system-ui, sans-serif; }
  /* The crop Check sent: a box dragged over it marks the place on the sheet. */
  #sent { display: block; max-width: 100%; height: auto; border: 1px solid #d4d4cf; }
  #sent:not([src]) { display: none; }
  #sent-boxes { position: absolute; left: 1px; top: 1px; width: calc(100% - 2px); height: calc(100% - 2px);
                cursor: crosshair; touch-action: none; }
  #sent-boxes .given, #sent-boxes .dragged { fill: rgb(37 99 235 / 0.08); stroke: #2563eb;
                                             stroke-width: 1.5; stroke-dasharray: 4 3; }
  #sent-groups button { padding: 2px 10px; margin: 0 6px 6px 0; }
  table { border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 2px 12px 2px 0; vertical-align: top; }
</style>
</head>
<body>
<main>
  <p id="counter"></p>
  <div id="place"></div>
  <div class="tools">
    <button id="check">Check</button>
    <button id="reopen">Reopen</button>
    <button id="next">Next task</button>
    <span id="status" role="status"></span>
  </div>
  <div class="tools">
    <label>Grid <select id="grid">
      <option value="squares">squares</option>
      <option value="lines">lines</option>
      <option value="dots">dots</option>
    </select></label>
    <label>Step <input id="step" type="number" min="20" max="500" value="50"></label>
    <button id="dark" aria-pressed="false">Dark theme</button>
  </div>
  <div class="tools">
    <label>Language <select id="lang">
      <option value="en">en</option>
      <option value="ru">ru</option>
      <option value="">none</option>
    </select></label>
    <label>Tools <select id="tools">
      <option value="pen eraser">pen and eraser</option>
      <option value="pen">pen alone</option>
    </select></label>
  </div>
  <div class="tools">
    <span>Groups</span>
    <label>Pause, ms <input id="pause" type="number" min="0" step="100"></label>
    <label>Across <input id="across" type="number" min="0"></label>
    <label>Down <input id="down" type="number" min="0"></label>
  </div>
  <div class="groups">
    <svg id="groups" role="img" aria-label="The groups of the strokes on the sheet"></svg>
    <table>
      <thead><tr><th>Label</th><th>Stroke IDs</th></tr></thead>
      <tbody id="table"></tbody>
    </table>
  </div>
  <div class="tools">
    <span>Crop</span>
    <label>Digits, px <select id="digit">
      <option>16</option>
      <option>24</option>
      <option selected>32</option>
      <option>48</option>
    </select></label>
  </div>
  <div class="crop">
    <figure>
      <div class="cropped">
        <img id="crop" alt="The crop for checking of the work on the sheet">
        <svg id="frames" aria-hidden="true"></svg>
      </div>
      <figcaption id="crop-caption"></figcaption>
    </figure>
    <table>
      <thead><tr><th>Digits</th><th>Drawn</th><th>Size, px</th><th>Tokens</th><th>PNG</th></tr></thead>
      <tbody id="heights"></tbody>
    </table>
  </div>
  <div class="tools">
    <span>Marks</span>
    <button id="unmark">Clear marks</button>
  </div>
  <div class="crop">
    <figure>
      <div class="cropped">
        <img id="sent" alt="The crop Check sent">
        <svg id="sent-boxes" role="img" aria-label="The crop Check sent: drag a box over it to mark the place on the sheet"></svg>
      </div>
      <figcaption id="sent-caption"></figcaption>
    </figure>
    <div id="sent-groups"></div>
  </div>
</main>
<script type="module" src="./main.ts"></script>
</body>
</html>
